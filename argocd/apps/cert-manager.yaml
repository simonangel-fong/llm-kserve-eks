# cert-manager.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.19.6"

    helm:
      valuesObject:
        crds:
          enabled: true

        # Keep the control plane off Karpenter-managed capacity.
        nodeSelector:
          role: bootstrap
        webhook:
          nodeSelector:
            role: bootstrap
        cainjector:
          nodeSelector:
            role: bootstrap
        startupapicheck:
          nodeSelector:
            role: bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
